<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f5f2ed;
      color: #24201d;
      font-family: system-ui, sans-serif;
    }
    article {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid #ded7cf;
      border-radius: 18px;
      background: white;
      box-shadow: 0 18px 60px rgba(55, 42, 30, .12);
    }
    span { color: #d94716; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1; }
    p { margin: 0; color: #665f58; line-height: 1.65; }
  </style>
</head>
<body>
  <article>
    <h1>Hello!</h1>
    <p>Welcome to my website.</p>
  </article>
</body>
</html>
